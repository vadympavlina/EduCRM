name: Deploy site to GitHub Pages

# Деплой на кожен пуш у main + кнопка «Run workflow» для ручного запуску.
# Потрібно один раз: Settings → Pages → Source = «GitHub Actions».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pack the CRM extensions (extension.zip, extension-marketing.zip)
        run: |
          (cd extension && zip -qr ../extension.zip . -x '*.DS_Store')
          (cd extension-marketing && zip -qr ../extension-marketing.zip . -x '*.DS_Store')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
